<!doctype html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <title>İletişim - Kişisel Web Sitem</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link href="style.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container my-5" id="app">
    <div class="d-flex align-items-center mb-4">
        <a href="index.html" class="btn btn-outline-secondary btn-sm me-3">← Ana Sayfa</a>
        <h2 class="mb-0 flex-grow-1 text-center">Bize Ulaşın</h2>
    </div>

    <form action="iletisim_islem.php" method="POST" id="contactForm" class="p-4 border rounded bg-white shadow-sm">

        <div class="mb-3">
            <label class="form-label">Ad Soyad</label>
            <input type="text" name="adSoyad" id="adSoyad" class="form-control" v-model="form.ad" placeholder="Adınızı giriniz">
            <div class="error-msg" v-if="vueErrors.ad">{{ vueErrors.ad }}</div>
        </div>

        <div class="mb-3">
            <label class="form-label">E-posta</label>
            <input type="email" name="email" id="email" class="form-control" v-model="form.email" placeholder="ornek@mail.com">
            <div class="error-msg" v-if="vueErrors.email">{{ vueErrors.email }}</div>
        </div>

        <div class="mb-3">
            <label class="form-label">Telefon</label>
            <input type="tel" name="telefon" id="telefon" v-model="form.telefon" class="form-control" placeholder="05XXXXXXXXX (sadece rakam)">
            <div class="error-msg" v-if="vueErrors.telefon">{{ vueErrors.telefon }}</div>
        </div>

        <div class="mb-3">
            <label class="form-label">Konu</label>
            <select id="konu" name="konu" v-model="form.konu" class="form-select">
                <option value="">Seçiniz...</option>
                <option value="teknik">Teknik Destek</option>
                <option value="gorus">Görüş ve Öneri</option>
                <option value="diger">Diğer</option>
            </select>
            <div class="error-msg" v-if="vueErrors.konu">{{ vueErrors.konu }}</div>
        </div>

        <div class="mb-3">
            <label class="form-label d-block">Cinsiyet</label>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" id="kadin" name="cinsiyet" v-model="form.cinsiyet" value="kadin">
                <label class="form-check-label" for="kadin">Kadın</label>
            </div>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" id="erkek" name="cinsiyet" v-model="form.cinsiyet" value="erkek">
                <label class="form-check-label" for="erkek">Erkek</label>
            </div>
            <div class="error-msg" v-if="vueErrors.cinsiyet">{{ vueErrors.cinsiyet }}</div>
        </div>

        <div class="mb-3">
            <label class="form-label">Mesajınız</label>
            <textarea id="mesaj" name="mesaj" v-model="form.mesaj" class="form-control" rows="3" placeholder="Mesajınızı buraya yazınız..."></textarea>
            <div class="error-msg" v-if="vueErrors.mesaj">{{ vueErrors.mesaj }}</div>
        </div>

        <div class="mb-3">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="kvkk" id="kvkk" v-model="form.kvkk">
                <label class="form-check-label" for="kvkk">KVKK metnini okudum, onaylıyorum.</label>
            </div>
            <div class="error-msg" v-if="vueErrors.kvkk">{{ vueErrors.kvkk }}</div>
        </div>

        <div class="d-flex gap-3">
            <button type="button" onclick="validateVanilla(event)" class="btn btn-primary w-50">Native JS ile Gönder</button>
            <button type="button" @click="validateVue" class="btn btn-success w-50">Vue.js ile Gönder</button>
        </div>

    </form>
</div>

<script>
    // --- NATIVE (VANILLA) JS DOĞRULAMA ---
    function validateVanilla(event) {
        event.preventDefault();

        document.querySelectorAll('.vanilla-err').forEach(el => el.remove());
        ['adSoyad', 'email', 'telefon', 'konu', 'mesaj'].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.style.borderColor = '';
        });

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        const telRegex   = /^\d{10,11}$/;

        const ad       = document.getElementById('adSoyad').value.trim();
        const email    = document.getElementById('email').value.trim();
        const telefon  = document.getElementById('telefon').value.trim();
        const konu     = document.getElementById('konu').value;
        const mesaj    = document.getElementById('mesaj').value.trim();
        const cinsiyet = document.querySelector('input[name="cinsiyet"]:checked');
        const kvkk     = document.getElementById('kvkk').checked;

        let hatalar = {};

        if (!ad)                           hatalar.ad       = 'Ad Soyad boş olamaz.';
        if (!email)                        hatalar.email    = 'E-posta boş olamaz.';
        else if (!emailRegex.test(email))  hatalar.email    = 'Geçersiz e-posta formatı.';
        if (!telefon)                      hatalar.telefon  = 'Telefon boş olamaz.';
        else if (!telRegex.test(telefon))  hatalar.telefon  = 'Telefon 10-11 haneli rakamdan oluşmalıdır.';
        if (!konu)                         hatalar.konu     = 'Lütfen bir konu seçiniz.';
        if (!cinsiyet)                     hatalar.cinsiyet = 'Lütfen cinsiyet seçiniz.';
        if (!mesaj)                        hatalar.mesaj    = 'Mesaj boş olamaz.';
        if (!kvkk)                         hatalar.kvkk     = 'KVKK onayı zorunludur.';

        const alanMap = { ad: 'adSoyad', email: 'email', telefon: 'telefon', konu: 'konu', mesaj: 'mesaj' };
        Object.entries(alanMap).forEach(([key, id]) => {
            const el = document.getElementById(id);
            const wrapper = el ? el.closest('.mb-3') : null;
            if (!wrapper) return;
            if (hatalar[key]) {
                el.style.borderColor = '#dc3545';
                const div = document.createElement('div');
                div.className = 'error-msg vanilla-err';
                div.textContent = hatalar[key];
                wrapper.appendChild(div);
            } else {
                el.style.borderColor = '#198754';
            }
        });

        if (hatalar.cinsiyet) {
            const wrapper = document.querySelector('input[name="cinsiyet"]').closest('.mb-3');
            if (!wrapper.querySelector('.vanilla-err')) {
                const div = document.createElement('div');
                div.className = 'error-msg vanilla-err';
                div.textContent = hatalar.cinsiyet;
                wrapper.appendChild(div);
            }
        }

        if (hatalar.kvkk) {
            const wrapper = document.getElementById('kvkk').closest('.mb-3');
            if (!wrapper.querySelector('.vanilla-err')) {
                const div = document.createElement('div');
                div.className = 'error-msg vanilla-err';
                div.textContent = hatalar.kvkk;
                wrapper.appendChild(div);
            }
        }

        // Hata yoksa formu gönder
        if (Object.keys(hatalar).length === 0) {
            document.getElementById('contactForm').submit();
        }
    }

    // --- VUE.JS DOĞRULAMA ---
    var { createApp } = Vue;

    createApp({
        data() {
            return {
                form: { ad: '', email: '', telefon: '', konu: '', cinsiyet: '', mesaj: '', kvkk: false },
                vueErrors: {}
            };
        },
        methods: {
            validateVue() {
                this.vueErrors = {};

                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                const telRegex   = /^\d{10,11}$/;

                if (!this.form.ad.trim())
                    this.vueErrors.ad = 'Ad Soyad boş olamaz.';
                if (!this.form.email.trim())
                    this.vueErrors.email = 'E-posta boş olamaz.';
                else if (!emailRegex.test(this.form.email))
                    this.vueErrors.email = 'Geçersiz e-posta formatı.';
                if (!this.form.telefon.trim())
                    this.vueErrors.telefon = 'Telefon boş olamaz.';
                else if (!telRegex.test(this.form.telefon))
                    this.vueErrors.telefon = 'Telefon 10-11 haneli rakamdan oluşmalıdır.';
                if (!this.form.konu)
                    this.vueErrors.konu = 'Lütfen bir konu seçiniz.';
                if (!this.form.cinsiyet)
                    this.vueErrors.cinsiyet = 'Lütfen cinsiyet seçiniz.';
                if (!this.form.mesaj.trim())
                    this.vueErrors.mesaj = 'Mesaj boş olamaz.';
                if (!this.form.kvkk)
                    this.vueErrors.kvkk = 'KVKK onayı zorunludur.';

                // Hata yoksa Vue değerlerini DOM'a yaz ve formu gönder
                if (Object.keys(this.vueErrors).length === 0) {
                    document.getElementById('adSoyad').value = this.form.ad;
                    document.getElementById('email').value   = this.form.email;
                    document.getElementById('telefon').value = this.form.telefon;
                    document.getElementById('konu').value    = this.form.konu;
                    document.getElementById('mesaj').value   = this.form.mesaj;
                    const radio = document.querySelector(`input[name="cinsiyet"][value="${this.form.cinsiyet}"]`);
                    if (radio) radio.checked = true;
                    document.getElementById('kvkk').checked = this.form.kvkk;

                    document.getElementById('contactForm').submit();
                }
            }
        }
    }).mount('#app');
</script>

</body>
</html>
