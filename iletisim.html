<!doctype html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <title>İletişim - Kişisel Web Sitem</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body class="bg-light">

<div class="container my-5" id="app">
    <h2 class="text-center mb-4">Bize Ulaşın</h2>
    
    <form action="iletisim_islem.php"  method="POST" id="contactForm" class="p-4 border rounded bg-white shadow-sm">
        <div class="mb-3">
            <label class="form-label">Ad Soyad</label>
            <input type="text" name="adSoyad" id="adSoyad" required class="form-control" v-model="form.ad" class="form-control" placeholder="Adınızı giriniz">
        </div>

        <div class="mb-3">
            <label class="form-label">E-posta</label>
            <input type="email" name="email" id="email" required class="form-control" v-model="form.email" class="form-control" placeholder="ornek@mail.com">
        </div>

        <div class="mb-3">
            <label class="form-label">Telefon</label>
            <input type="tel" name="telefon" id="telefon" v-model="form.telefon" pattern="[0-9]+" class="form-control" placeholder="Sadece rakam">
        </div>

        <div class="mb-3">
            <label class="form-label">Konu</label>
            <select id="konu" v-model="form.konu" class="form-select" required class="form-select">
                <option value="">Seçiniz...</option>
                <option value="teknik">Teknik Destek</option>
                <option value="gorus">Görüş ve Öneri</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label d-block">Cinsiyet</label>
            <input type="radio" name="cinsiyet" v-model="form.cinsiyet" value="kadin"> Kadın
            <input type="radio" name="cinsiyet" v-model="form.cinsiyet" value="erkek" class="ms-3"> Erkek
        </div>

        <div class="mb-3">
            <label class="form-label">Mesajınız</label>
            <textarea id="mesaj" v-model="form.mesaj" class="form-control" rows="3"></textarea>
        </div>

        <div class="mb-3">
            <input type="checkbox" name="kvkk" id="kvkk" v-model="form.kvkk">
            <label class="form-check-label" for="kvkk">KVKK metnini okudum, onaylıyorum.</label>
        </div>

        <div class="d-flex gap-3">
            <button type="submit" onclick="validateVanilla()" class="btn btn-primary w-50">Vanilla JS ile Gönder</button>
            <button type="submit" @click="validateVue" class="btn btn-success w-50">Vue.js ile Gönder</button>
        </div>
    </form>
</div>

<script>
    // --- VANILLA JS DOĞRULAMA (Buton 1) ---
    function validateVanilla() {
        const ad = document.getElementById('adSoyad').value;
        const email = document.getElementById('email').value;
        const tel = document.getElementById('telefon').value;
        
        // Basit Regexler
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        const telRegex = /^\d+$/;

        if (!ad || !email || !tel) {
            alert("Lütfen tüm alanları doldurun!");
        } else if (!emailRegex.test(email)) {
            alert("Geçersiz e-posta formatı!");
        } else if (!telRegex.test(tel)) {
            alert("Telefon sadece rakamlardan oluşmalıdır!");
        } else {
            alert("Vanilla JS: Form başarıyla gönderildi!");
        }
    }

    // --- VUE.JS DOĞRULAMA (Buton 2) ---
    const { createApp } = Vue;

    createApp({
        data() {
            return {
                form: { ad: '', email: '', telefon: '', konu: '', cinsiyet: '', mesaj: '', kvkk: false }
            }
        },
        methods: {
            validateVue() {
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                const telRegex = /^\d+$/;

                if (!this.form.ad || !this.form.email || !this.form.telefon) {
                    alert("Vue.js: Lütfen tüm alanları doldurun!");
                } else if (!emailRegex.test(this.form.email)) {
                    alert("Vue.js: Geçersiz e-posta!");
                } else if (!telRegex.test(this.form.telefon)) {
                    alert("Vue.js: Telefon sadece rakam olmalı!");
                } else if (!this.form.kvkk) {
                    alert("Vue.js: Lütfen sözleşmeyi onaylayın!");
                } else {
                    alert("Vue.js: Form başarıyla gönderildi!");
                }
            }
        }
    }).mount('#app');
</script>

</body>
</html>
